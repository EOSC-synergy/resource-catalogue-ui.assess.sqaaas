        - /usr/bin/env sh .sqa/script.periwinkle_aware_ibis.sh
        container: qc.acc_fog_romantic_kiwi
  QC.Doc:
    repos:
      github.com/madgeek-arc/resource-catalogue-ui find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.nutmeg_foolish_flounder.sh
        container: qc.doc_ecru_kind_beaver
      github.com/madgeek-arc/resource-catalogue-ui git:
        commands:
        - /usr/bin/env sh .sqa/script.vermilion_creative_kraken.sh
        container: qc.doc_cardamom_articulate_lobster
      github.com/madgeek-arc/resource-catalogue-ui markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.porcelain_serene_grizzly.sh
        container: qc.doc_frost_shrewd_whale
  QC.Lic:
    repos:
      github.com/madgeek-arc/resource-catalogue-ui licensee:
        commands:
        - /usr/bin/env sh .sqa/script.sunset_vigilant_wasp.sh
