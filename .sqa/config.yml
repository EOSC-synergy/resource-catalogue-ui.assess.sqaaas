    repos:
      github.com/madgeek-arc/resource-catalogue-ui hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.cosmos_dedicated_warthog.sh
        container: qc.sty_cayenne_helpful_squid
      github.com/madgeek-arc/resource-catalogue-ui jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.powder_agile_donkey.sh
        container: qc.sty_puce_silly_moose
  QC.Ver:
    repos:
      github.com/madgeek-arc/resource-catalogue-ui get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.polar_innocent_albatross.sh
        container: qc.ver_gold_open_crow
timeout: 5400
